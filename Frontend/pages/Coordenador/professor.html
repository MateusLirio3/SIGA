<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professores · SIGA</title>
    <link rel="stylesheet" href="../../static/css/global.css">
    <link rel="stylesheet" href="../../static/css/components.css">
    <link rel="stylesheet" href="../../static/css/coordenador/coordenador.css">
    <link rel="stylesheet" href="../../static/css/coordenador/professores.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="dashboard">
        <div class="filters-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nome, matrícula ou CPF..."
                    onkeyup="filtrar()">
            </div>
            <button class="btn-filter" onclick="limparFiltros()">
                <i class="fas fa-undo"></i> Limpar
            </button>
            <button class="btn-primary" onclick="abrirModal()">
                <i class="fas fa-plus"></i> Novo Professor
            </button>
            <span class="total-registros" id="totalRegistros">0 professores</span>
        </div>

        <div class="card full">
            <div class="table-responsive">
                <table class="table-professores">
                    <thead>
                        <tr>
                            <th style="width:50px;">#</th>
                            <th>Nome</th>
                            <th>Matrícula</th>
                            <th>CPF</th>
                            <th>Disciplina</th>
                            <th style="width:130px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-user-plus"></i> Novo Professor</h2>
                <button class="modal-fechar" onclick="fecharModal()">×</button>
            </div>
            <form id="form" onsubmit="salvar(event)">
                <input type="hidden" id="itemId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome *</label>
                        <input type="text" id="nome" placeholder="Nome completo" required>
                    </div>
                    <div class="form-group">
                        <label>Matrícula *</label>
                        <input type="text" id="matricula" placeholder="Ex: 2025468749122" required maxlength="13">
                    </div>
                    <div class="form-group">
                        <label>CPF *</label>
                        <input type="text" id="cpf" placeholder="000.000.000-00" required maxlength="11">
                    </div>
                    <fieldset class="form-group disciplinas-group">
                        <legend>Disciplinas</legend>
                        <div id="disciplinas-container" class="disciplinas-options">
                            <span>Carregando disciplinas...</span>
                        </div>
                    </fieldset>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="email@exemplo.com">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-primary" id="btnSalvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../static/js/Components/carregadorComponentes.js"></script>
    <script src="../../static/js/Coordenador/professores.js"></script>
</body>

</html>
