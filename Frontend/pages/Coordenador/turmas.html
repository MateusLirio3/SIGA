<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turmas · SIGA</title>
    <link rel="stylesheet" href="../../static/css/global.css">
    <link rel="stylesheet" href="../../static/css/components.css">
    <link rel="stylesheet" href="../../static/css/coordenador/coordenador.css">
    <link rel="stylesheet" href="../../static/css/coordenador/turmas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="dashboard">
        <div class="filters-bar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por nome, curso ou período..."
                    onkeyup="filtrar()">
            </div>
            <select id="filterCurso" onchange="filtrar()">
                <option value="">Todos os cursos</option>

            </select>
            <select id="filterPeriodo" onchange="filtrar()">
                <option value="">Todos os períodos</option>
                <option value="Matutino">Matutino</option>
                <option value="Vespertino">Vespertino</option>
                <option value="Noturno">Noturno</option>
                <option value="Integral">Integral</option>
            </select>
            <button class="btn-filter" onclick="limparFiltros()">
                <i class="fas fa-undo"></i> Limpar
            </button>
            <button class="btn-primary" onclick="abrirModal()">
                <i class="fas fa-plus"></i> Nova Turma
            </button>
            <span class="total-registros" id="totalRegistros">0 turmas</span>
        </div>

        <div class="card full">
            <div class="table-responsive">
                <table class="table-turmas">
                    <thead>
                        <tr>
                            <th style="width:50px;">#</th>
                            <th>Nome</th>
                            <th>Curso</th>
                            <th>Período</th>
                            <th>Alunos</th>
                            <th>Ano</th>
                            <th style="width:130px;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle"><i class="fas fa-door-open"></i> Nova Turma</h2>
                <button class="modal-fechar" onclick="fecharModal()">×</button>
            </div>
            <form id="form" onsubmit="salvar(event)">
                <input type="hidden" id="itemId">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome *</label>
                        <input type="text" id="nome" placeholder="Ex: 3° A" required>
                    </div>
                    <div class="form-group">
                        <label>Curso *</label>
                        <select id="curso" required>
                            <option value="">Selecione</option>

                        </select>
                    </div>
                    <div class="form-group">
                        <label>Período</label>
                        <select id="periodo">
                            <option value="Matutino">Matutino</option>
                            <option value="Vespertino">Vespertino</option>
                            <option value="Noturno">Noturno</option>
                            <option value="Integral">Integral</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Ano</label>
                        <input type="number" id="ano" placeholder="2026" value="2026">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-primary" id="btnSalvar">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>

    <script src="../../static/js/Components/carregadorComponentes.js"></script>
    <script src="../../static/js/Coordenador/turmas.js"></script>
</body>

</html>
